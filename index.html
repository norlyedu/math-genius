<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathGenius - Penjana Lembaran Kerja</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Calibri, 'Candara', 'Segoe UI', 'Optima', Arial, sans-serif;
            background-color: #f3f4f6;
        }

        @page {
            size: A4;
            margin: 15mm 15mm 20mm 15mm;
        }

        @media print {
            .no-print { 
                display: none !important; 
            }
            
            body { 
                background: white !important; 
            }

            .main-content {
                padding: 0 !important;
                display: block !important;
                width: 100% !important;
            }

            .print-area { 
                padding: 0 !important; 
                margin: 0 !important; 
                border: none !important; 
                box-shadow: none !important; 
                width: 100% !important;
                transform: none !important;
            }
            
            .question-box {
                break-inside: avoid;
                page-break-inside: avoid;
                margin-bottom: 1.5rem;
            }
        }

        @media screen {
            .main-content {
                padding: 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
            }

            #worksheet {
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
                width: 210mm;
                min-height: 297mm;
                background: white;
                transform-origin: top center;
                margin-top: 20px;
            }
            
            /* Responsive Scaling for Mobile Preview */
            @media (max-width: 850px) {
                #worksheet {
                    transform: scale(0.45);
                    margin-bottom: -160mm;
                }
            }
            @media (max-width: 500px) {
                #worksheet {
                    transform: scale(0.35);
                    margin-bottom: -190mm;
                }
            }
        }

        .math-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 1.5rem;
        }

        .vertical-math {
            font-size: 14pt; 
            text-align: right;
            width: fit-content;
            margin: 0 auto;
            font-weight: bold;
        }

        .ans-space-standard { height: 50px; }
        .ans-space-darab { height: 80px; }
        .ans-space-bahagi { height: 130px; }
    </style>
</head>
<body>

    <!-- Header & Controls (Top Layout) -->
    <header class="no-print bg-white border-b sticky top-0 z-50 shadow-sm w-full">
        <div class="max-w-6xl mx-auto p-4">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-4">
                <div class="flex items-center gap-2 text-blue-600">
                    <i class="fas fa-calculator text-2xl"></i>
                    <h1 class="text-xl font-bold tracking-tight">MathGenius</h1>
                </div>
            </div>

            <!-- Controls Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 bg-gray-50 p-4 rounded-xl border border-gray-100">
                <!-- Operation -->
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2">1. Operasi</label>
                    <div class="flex gap-1">
                        <button onclick="setOp('tambah')" id="btn-tambah" class="op-btn flex-1 p-2 rounded-lg border-2 border-blue-600 bg-blue-50 text-blue-600 transition"><i class="fas fa-plus"></i></button>
                        <button onclick="setOp('tolak')" id="btn-tolak" class="op-btn flex-1 p-2 rounded-lg border-2 border-gray-200 text-gray-400 transition"><i class="fas fa-minus"></i></button>
                        <button onclick="setOp('darab')" id="btn-darab" class="op-btn flex-1 p-2 rounded-lg border-2 border-gray-200 text-gray-400 transition"><i class="fas fa-times"></i></button>
                        <button onclick="setOp('bahagi')" id="btn-bahagi" class="op-btn flex-1 p-2 rounded-lg border-2 border-gray-200 text-gray-400 transition"><i class="fas fa-divide"></i></button>
                    </div>
                </div>

                <!-- Range -->
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2">2. Lingkungan</label>
                    <select id="rangeSelect" class="w-full border rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" onchange="generateWorksheet()">
                        <option value="100">Hingga 100</option>
                        <option value="1000">Hingga 1,000</option>
                        <option value="10000">Hingga 10,000</option>
                        <option value="100000">Hingga 100,000</option>
                        <option value="1000000">Hingga 1,000,000</option>
                    </select>
                </div>

                <!-- Technique -->
                <div>
                    <label id="optionLabel" class="block text-[10px] font-bold text-gray-400 uppercase mb-2">3. Teknik</label>
                    <select id="regroupSelect" class="w-full border rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" onchange="generateWorksheet()">
                        <option value="yes">Kumpul Semula</option>
                        <option value="no">Tanpa Kumpul</option>
                    </select>
                </div>

                <!-- Count -->
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2">4. Bilangan</label>
                    <select id="numQuestions" class="w-full border rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" onchange="generateWorksheet()">
                        <option value="10">10 Soalan</option>
                        <option value="15">15 Soalan</option>
                        <option value="20" selected>20 Soalan</option>
                        <option value="30">30 Soalan</option>
                    </select>
                </div>
            </div>

            <!-- Action Buttons (Moved to Bottom of Panel) -->
            <div class="flex flex-col sm:flex-row gap-2 mt-4">
                <button onclick="generateWorksheet()" class="flex-1 bg-blue-600 text-white px-4 py-3 rounded-lg font-bold hover:bg-blue-700 active:scale-95 transition flex items-center justify-center gap-2">
                    <i class="fas fa-sync-alt"></i> Jana Soalan Baru
                </button>
                <button onclick="handlePrint()" class="flex-1 bg-emerald-500 text-white px-4 py-3 rounded-lg font-bold hover:bg-emerald-600 active:scale-95 transition flex items-center justify-center gap-2">
                    <i class="fas fa-print"></i> Cetak Lembaran (PDF)
                </button>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div id="worksheet" class="p-12 print-area flex flex-col">
            <header class="border-b-2 border-black pb-6 mb-10">
                <h2 id="sheetTitle" class="text-3xl font-bold uppercase tracking-tighter text-center w-full mb-6">MANTAP OPERASI ASAS</h2>
                <div class="grid grid-cols-2 gap-x-12 gap-y-4 text-sm font-bold text-black text-left">
                    <div class="flex gap-2 whitespace-nowrap">NAMA: <span class="border-b border-black flex-1 min-w-[100px]"></span></div>
                    <div class="flex gap-2 whitespace-nowrap">TARIKH: <span class="border-b border-black flex-1 min-w-[100px]"></span></div>
                    <div class="flex gap-2 whitespace-nowrap">KELAS: <span class="border-b border-black flex-1 min-w-[100px]"></span></div>
                    <div class="flex gap-2 whitespace-nowrap">MARKAH: <span class="border-b border-black flex-1 min-w-[100px]"></span></div>
                </div>
            </header>

            <div id="questionContainer" class="math-grid"></div>

            <footer class="mt-auto pt-8">
                <div class="border-t-2 border-black pt-4 text-center">
                    <p class="italic font-bold text-gray-800 text-[12px]">
                        "Matematik itu mudah jika kita berusaha. Cuba dulu, jangan mengalah!"
                    </p>
                    <div class="mt-2 flex justify-between items-center text-[10px] text-gray-500 font-bold uppercase tracking-widest">
                        <span>© CikguNorlySKSE</span>
                        <span>MathGenius v2.2</span>
                    </div>
                </div>
            </footer>
        </div>
    </main>

    <script>
        let currentOp = 'tambah';

        function formatNum(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
        }

        // Improved Print Handler for Mobile
        function handlePrint() {
            // Give a tiny delay to ensure DOM is ready and any keyboard is closed on mobile
            setTimeout(() => {
                window.print();
            }, 250);
        }

        function setOp(op) {
            currentOp = op;
            document.querySelectorAll('.op-btn').forEach(btn => {
                btn.classList.remove('border-blue-600', 'bg-blue-50', 'text-blue-600');
                btn.classList.add('border-gray-200', 'text-gray-400');
            });

            const activeBtn = document.getElementById(`btn-${op}`);
            activeBtn.classList.remove('border-gray-200', 'text-gray-400');
            activeBtn.classList.add('border-blue-600', 'bg-blue-50', 'text-blue-600');
            
            const optionLabel = document.getElementById('optionLabel');
            const regroupSelect = document.getElementById('regroupSelect');
            
            if (optionLabel && regroupSelect) {
                regroupSelect.innerHTML = '';
                if (op === 'darab' || op === 'bahagi') {
                    optionLabel.innerText = "3. Digit Pendarab";
                    const opt1 = new Option("1 Digit", "1digit");
                    const opt2 = new Option("2 Digit", "2digit");
                    regroupSelect.add(opt1);
                    regroupSelect.add(opt2);
                } else {
                    optionLabel.innerText = "3. Teknik";
                    const opt1 = new Option("Kumpul Semula", "yes");
                    const opt2 = new Option("Tanpa Kumpul", "no");
                    regroupSelect.add(opt1);
                    regroupSelect.add(opt2);
                }
            }
            generateWorksheet();
        }

        function generateWorksheet() {
            const num = parseInt(document.getElementById('numQuestions').value);
            const range = parseInt(document.getElementById('rangeSelect').value);
            const optionVal = document.getElementById('regroupSelect').value;
            const container = document.getElementById('questionContainer');
            
            const titles = { 'tambah': 'TAMBAH', 'tolak': 'TOLAK', 'darab': 'DARAB', 'bahagi': 'BAHAGI' };
            document.getElementById('sheetTitle').innerText = 'MANTAP OPERASI ASAS - ' + titles[currentOp];
            
            container.innerHTML = '';
            for (let i = 1; i <= num; i++) {
                const q = createQuestion(currentOp, range, optionVal);
                const qBox = document.createElement('div');
                
                let minH = (currentOp === 'tambah' || currentOp === 'tolak') ? "min-h-[140px]" : "min-h-[160px]";
                if (currentOp === 'bahagi') minH = "min-h-[200px]";

                qBox.className = `question-box p-4 border border-gray-100 rounded-lg flex flex-col items-center justify-start relative ${minH}`;
                
                let html = `<div class="absolute top-1 left-2 text-[11px] font-bold text-gray-400 no-print">#${i}</div>`;
                html += `<div class="vertical-math mt-2 font-mono text-black">`;
                
                if (currentOp === 'bahagi') {
                    html += `<div class="flex items-end pr-1 mb-2 font-bold"><span class="mr-2 mb-1 text-lg">${formatNum(q.num2)}</span><div class="border-l-4 border-t-4 border-black p-2 px-4 min-w-[100px] text-right text-xl">${formatNum(q.num1)}</div></div><div class="ans-space-bahagi"></div>`;
                } else {
                    const symbol = currentOp === 'darab' ? '×' : (currentOp === 'tambah' ? '+' : '-');
                    let ansClass = currentOp === 'darab' ? 'ans-space-darab' : 'ans-space-standard';
                    html += `<div class="mb-1 text-xl font-bold">${formatNum(q.num1)}</div><div class="flex justify-between border-b-4 border-black pb-2 gap-8 text-xl font-bold"><span>${symbol}</span><span>${formatNum(q.num2)}</span></div><div class="${ansClass}"></div>`;
                }

                html += `</div>`;
                qBox.innerHTML = html;
                container.appendChild(qBox);
            }
        }

        function createQuestion(op, range, optionVal) {
            let num1, num2;
            if (op === 'tambah') {
                if (optionVal === 'no') {
                    let n1 = "", n2 = "";
                    let digits = range === 1000000 ? 6 : range.toString().length - 1;
                    for(let i=0; i<digits; i++) {
                        let d1 = Math.floor(Math.random() * 8) + 1;
                        let d2 = Math.floor(Math.random() * (9 - d1));
                        n1 = d1.toString() + n1; n2 = d2.toString() + n2;
                    }
                    num1 = parseInt(n1); num2 = parseInt(n2);
                } else {
                    num1 = Math.floor(Math.random() * (range * 0.8)) + (range * 0.1);
                    num2 = Math.floor(Math.random() * (range - num1)) + 5;
                }
            } else if (op === 'tolak') {
                if (optionVal === 'no') {
                    let n1 = "", n2 = "";
                    let digits = range === 1000000 ? 6 : range.toString().length - 1;
                    for(let i=0; i<digits; i++) {
                        let d1 = Math.floor(Math.random() * 8) + 1;
                        let d2 = Math.floor(Math.random() * (d1 + 1));
                        n1 = d1.toString() + n1; n2 = d2.toString() + n2;
                    }
                    num1 = parseInt(n1); num2 = parseInt(n2);
                } else {
                    num1 = Math.floor(Math.random() * (range * 0.9)) + 10;
                    num2 = Math.floor(Math.random() * (num1 - 5)) + 1;
                }
            } else if (op === 'darab') {
                num2 = optionVal === '1digit' ? Math.floor(Math.random() * 8) + 2 : Math.floor(Math.random() * 90) + 10;
                num1 = Math.floor(Math.random() * (range / num2)) + 10;
            } else if (op === 'bahagi') {
                num2 = optionVal === '1digit' ? Math.floor(Math.random() * 8) + 2 : Math.floor(Math.random() * 90) + 10;
                num1 = num2 * (Math.floor(Math.random() * (range / num2)) + 2);
                if (num1 > range) num1 = num2 * Math.floor(range/num2);
            }
            return { num1: Math.floor(num1 || 10), num2: Math.floor(num2 || 5) };
        }

        window.onload = () => setOp('tambah');
    </script>
</body>
</html>
